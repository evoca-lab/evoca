<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon.png">
    <title>Página no encontrada | Evoca Lab</title>
    <style>
      :root {
        --ink: #050505;
        --paper: #f4f0ea;
        --white: #fffaf5;
        --muted: rgba(255, 250, 245, 0.58);
        --line: rgba(255, 250, 245, 0.11);
        --pink: #FF1A7A;
        --orange: #FF5F1F;
        --accent-soft: #ff8a5c;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --font: Avenir, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        --mono: Avenir, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--ink);
      }

      body {
        margin: 0;
        font-family: var(--font);
        color: var(--white);
        background: var(--ink);
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      ::selection {
        color: var(--white);
        background: var(--pink);
      }

      .seo-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
}

      .noise {
  position: fixed;
  inset: 0;
  z-index: 95;

  pointer-events: none;

  opacity: 0.45;

  background-image: url("/assets/riso_texture.webp");
  background-position: center;
  background-size: 1000px auto;

  mix-blend-mode: overlay;
}

      .page::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background: #050505;
      }

      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        pointer-events: none;
        background: rgba(255, 25, 118, 0.62);
        box-shadow:
          0 0 30px rgba(255, 25, 118, 0.58),
          0 0 90px rgba(255, 107, 43, 0.28);
        filter: blur(10px);
        mix-blend-mode: screen;
        transform: translate3d(-100px, -100px, 0);
        transition:
          width 500ms var(--ease),
          height 500ms var(--ease),
          border-radius 500ms var(--ease),
          background 500ms var(--ease),
          color 500ms var(--ease);
      }

      .cursor::after {
        position: absolute;
        inset: 0;
        display: grid;
        content: "DESCUBRIR";
        color: transparent;
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        place-items: center;
        transition: color 350ms var(--ease);
      }

      .cursor.is-quote {
        width: 92px;
        height: 24px;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        filter: none;
        mix-blend-mode: normal;
      }

      .cursor.is-quote::after {
        color: var(--pink);
      }

      .page {
        min-height: 100vh;
        isolation: isolate;
      }

      .site-header {
        position: fixed;
        top: 14px;
        left: 0;
        z-index: 96;
        width: 100%;
        padding: 0 24px;
        animation: navEnter 900ms var(--ease) 40ms both;
      }

      .nav-shell {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
        width: min(1320px, 100%);
        min-height: 54px;
        margin: 0 auto;
        padding: 7px 10px 7px 22px;
        border: 1px solid rgba(255, 250, 245, 0.09);
        border-radius: 999px;
        background: rgba(8, 8, 8, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.045),
          0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(22px);
      }

      .brand {
  display: inline-flex;

  align-items: center;

  gap: 0;

  width: 108px;

  height: auto;
}
      .brand::after {
        display: none;
      }

      .brand img {
  display: block;

  width: 100%;
  height: auto;


  transform: translateZ(0);

  backface-visibility: hidden;
}

      .nav-links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(26px, 4vw, 46px);
        font-family: var(--font);
        font-size: 0.72rem;
        font-stretch: condensed;
        font-weight: 400;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: rgba(245, 240, 236, 0.62);
      }

      .nav-links a {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: color 400ms var(--ease);
      }

      .nav-links a::before {
        content: "+";
        color: rgba(245, 240, 236, 0.8);
        font-size: 1.05em;
        line-height: 1;
        transform: translateY(-1px);
      }

      .nav-links a::after {
        position: absolute;
        right: 0;
        bottom: -8px;
        left: 0;
        height: 1px;
        content: "";
        background: var(--pink);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 500ms var(--ease);
      }

      .nav-links a:hover {
        color: var(--white);
        text-shadow:
  0 0 12px rgba(255,95,31,.18);
      }

      .nav-links a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      .nav-cta {
        display: inline-flex;
        justify-self: end;
        align-items: center;
        gap: 7px;
        min-height: auto;
        padding: 0;
        border: 0;
        border-radius: 0;
        color: rgba(245, 240, 236, 0.7);
        font-family: var(--font);
        font-size: 0.72rem;
        font-stretch: condensed;
        font-weight: 400;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        transition:
          color 500ms var(--ease),
          transform 500ms var(--ease);
      }
      
      .nav-cta:hover {
        transform: translateY(-2px);
        color: var(--pink);
      }
      .arrow-icon {
  font-family: Arial, sans-serif;

  font-style: normal;

  display: inline-block;
}
      .hero {
  position: relative;

  display: grid;

  min-height: 100svh;

  padding: 128px 22px 72px;

  overflow: hidden;

  place-items: center;

  background:
    radial-gradient(
      circle at 50% 120%,
      rgba(255, 107, 43, 0.11)
      transparent 42%
    ),

    radial-gradient(
      circle at 80% 90%,
      rgba(255, 25, 118, 0.08)
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #050505 0%,
      #070707 45%,
      #050505 100%
    );
}

.hero-grid {
        display: none;
      }

      .hero-glow {
  position: absolute;

  left: -420px;
  bottom: -520px;

  width: 1000px;
  height: 1000px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255, 95, 31, 0.95) 0%,
      rgba(255, 95, 31, 0.42) 18%,
      rgba(255, 95, 31, 0.12) 36%,
      transparent 62%
    ),

    radial-gradient(
      circle at 74% 38%,
      rgba(255, 0, 120, 0.72) 0%,
      rgba(255, 0, 120, 0.34) 12%,
      rgba(255, 0, 120, 0.14) 26%,
      transparent 44%
    );

  filter: blur(120px);

  opacity: .82;

  pointer-events: none;

  z-index: 0;

  mix-blend-mode: screen;

  animation: heroGlowFloat 9s ease-in-out infinite alternate;
}
      #signal-canvas {
        display: none;
      }

      .hero-inner {
  width: min(1220px, 100%);
  position: relative;
  z-index: 2;
  animation: heroBreath 7s ease-in-out infinite;
}

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        margin-bottom: 34px;
        color: rgba(255, 250, 245, 0.48);
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow span {
        color: var(--orange);
      }

      .hero-title {
  max-width: 1080px;

  margin: 0 auto;

  text-align: center;

  font-size: clamp(3.25rem, 7.5vw, 7.6rem);

  font-weight: 250;

  line-height: 0.86;

  letter-spacing: 0;

  color: #fffaf5;

  animation:
    heroBreath 7s ease-in-out infinite;
}

.hero-line {
  position: relative;

  display: block;

  opacity: 0;

  transform: translateY(70px);

  filter: blur(18px);

  animation:
    heroReveal 1600ms cubic-bezier(0.22, 1, 0.36, 1) forwards,
    heroFloat 6s ease-in-out infinite;
}

.hero-title::after {
  content: "";

  position: absolute;

  inset: -20%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.08),
      transparent 60%
    );

  filter: blur(40px);

  opacity: .6;

  animation: textGlowMove 8s linear infinite;

  pointer-events: none;
}

      .hero-title .italic {
        font-style: italic;
        font-weight: 400;
      }

      .hero-title .accent {
  position: relative;

  display: inline-block;

  color: #ff0078;

  font-weight: 900;

  text-shadow:
    0 0 18px rgba(255, 0, 120, 0.55),
    0 0 42px rgba(255, 0, 120, 0.42),
    0 0 90px rgba(255, 0, 120, 0.22);

  animation:
    starFloat 3.5s ease-in-out infinite,
    starPulse 2.2s ease-in-out infinite;

  transform-origin: center;
}

.hero-line:nth-child(2) {
  animation-delay: 180ms;
}



      .hero-line:nth-child(2) {
        animation-delay: 220ms;
      }

      .hero-copy {
        display: block;
        margin: 50px auto 0;
        color: var(--muted);
      }

      .hero-copy p {
        max-width: 470px;
        margin: 0 auto;
        font-size: clamp(1rem, 1.5vw, 1.22rem);
        line-height: 1.75;
        text-align: center;
      }

      .metric {
        display: none;
        gap: 8px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 250, 245, 0.14);
      }

      .metric:last-child {
        text-align: right;
      }

      .metric strong {
        color: var(--white);
        font-size: clamp(1.35rem, 2vw, 2rem);
        font-weight: 400;
        letter-spacing: 0;
      }

      .metric span {
        color: rgba(255, 250, 245, 0.42);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .scroll-cue {
        position: absolute;
        left: 50%;
        bottom: 30px;
        display: grid;
        width: 42px;
        height: 70px;
        border: 1px solid rgba(255, 250, 245, 0.18);
        border-radius: 999px;
        place-items: start center;
        padding-top: 13px;
        transform: translateX(-50%);
      }

      .scroll-cue::after {
        width: 5px;
        height: 5px;
        content: "";
        border-radius: 999px;
        background: var(--white);
        animation: scrollDot 1.7s var(--ease) infinite;
      }

      .section {
        position: relative;
        padding: clamp(90px, 12vw, 165px) 22px;
      }

      .light {
        color: #080808;
        background: var(--paper);
      }

      .wrap {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .statement {
  overflow: hidden;
  color: var(--white);
  background: transparent;
}
.statement::before {
  position: absolute;

  inset: 0;

  content: "";

  background:
    linear-gradient(
      180deg,
      rgba(5,5,5,0) 0%,
      rgba(5,5,5,0.35) 18%,
      rgba(5,5,5,0.72) 38%,
      #050505 0%
    );

  pointer-events: none;

  z-index: 0;
}

.statement .wrap {
  position: relative;
  z-index: 2;
}

      .kicker {
        display: none;
        align-items: center;
        gap: 15px;
        margin-bottom: 32px;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-family: var(--mono);
      }

      .kicker::before {
        width: 72px;
        height: 1px;
        content: "";
        background: var(--pink);
      }

      .big-statement {
        position: relative;
        max-width: 980px;
        margin: 0;
        font-size: clamp(2.45rem, 5.8vw, 5.8rem);
        font-weight: 260;
        line-height: 0.92;
        letter-spacing: 0;
      }

      .big-statement span {
        display: inline-block;
        transform: translateY(84px);
        opacity: 0;
        filter: blur(22px);
        transition:
          transform 1800ms var(--ease),
          opacity 1800ms var(--ease),
          filter 1800ms var(--ease);
        transition-delay: calc(var(--i) * 110ms);
      }

      .big-statement.is-visible span {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }

      .section-head {
        display: block;
        max-width: 760px;
        margin-bottom: 54px;
      }

      .section-label {
        color: rgba(255, 250, 245, 0.45);
        font-size: 0.7rem;
        font-family: var(--font);
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .light .section-label {
        color: rgba(5, 5, 5, 0.48);
      }

      .section-title {
        margin: 0;
        font-size: clamp(2rem, 3.4vw, 3.45rem);
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0;
      }

      .services-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .services-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.service-card {
  position: relative;

  min-height: 320px;
  padding: clamp(28px, 4vw, 42px);

  overflow: hidden;

  border: 1px solid rgba(255,255,255,0.022);
  border-radius: 22px;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,0.018),
    rgba(255,255,255,0.004)
  ),
  rgba(10,10,10,0.58);

  backdrop-filter: blur(18px);

  isolation: isolate;

  box-shadow:
  inset 0 1px 0 rgba(255,255,255,0.012);

  transform: translateY(42px);
  opacity: 0;
  filter: blur(12px);

  transition:
    transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
    border-color 700ms cubic-bezier(0.22, 1, 0.36, 1),
    background 700ms cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 700ms cubic-bezier(0.22, 1, 0.36, 1),
    filter 700ms cubic-bezier(0.22, 1, 0.36, 1);
}

.service-card::before {
  position: absolute;
  inset: -10%;

  content: "";

  opacity: 0;

  background:
    radial-gradient(
      circle at top left,
      rgba(255, 122, 26, 0.42),
      transparent 32%
    ),

    radial-gradient(
      circle at bottom right,
      rgba(255, 79, 147, 0.22),
      transparent 40%
    );

  transform:
    scale(1.15)
    translateY(20px);

  filter: blur(18px);

  transition:
    opacity 700ms ease,
    transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);

  pointer-events: none;
  z-index: 0;
}

.service-card.is-visible {
  transform: translateY(0);
  opacity: 1;
  filter: blur(0);
}

.service-card:hover {
  transform:
    translateY(-10px)
    scale(1.018);

  border-color:
    rgba(255,255,255,0.14);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.045),
      rgba(255,255,255,0.012)
    ),
    rgba(12,12,12,0.82);

  box-shadow:
    0 30px 90px rgba(0,0,0,0.42),
    0 0 50px rgba(255,122,26,0.08);
}

.service-card:hover::before {
  opacity: 1;

  transform:
    scale(1)
    translateY(0);
}

.service-top,
.service-bottom {
  position: relative;
  z-index: 2;
}

.service-top {
  display: flex;
  justify-content: flex-start;
  gap: 20px;
}

.service-number {
  color: rgba(255, 250, 245, 0.33);
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.18em;
}

.service-icon {
  display: none;
}

.service-card h3 {
  max-width: 520px;
  margin: 62px 0 0;

  font-size: clamp(1.7rem, 2.7vw, 2.55rem);
  font-weight: 300;
  line-height: 0.98;
  letter-spacing: 0;

  transition:
    transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
    color 500ms ease;
}

.service-card:hover h3 {
  transform: translateY(-4px);
}

.service-card p {
  max-width: 520px;
  margin: 28px 0 0;

  color: rgba(255, 250, 245, 0.55);

  font-size: 0.98rem;
  line-height: 1.78;
}

.service-cta {
  position: relative;
  z-index: 1;

  display: inline-flex;
  align-items: center;
  gap: 14px;

  margin-top: 42px;

  color: rgba(255, 250, 245, 0.48);

  font-family: var(--font);
  font-size: 0.68rem;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;

  transition: color 500ms var(--ease);
}

.service-cta::after {
  width: 42px;
  height: 1px;

  content: "";

  background: rgba(255, 250, 245, 0.18);

  transition:
    width 600ms var(--ease),
    background 600ms var(--ease);
}

.service-card:hover .service-cta {
  color: var(--orange);
}

.service-card:hover .service-cta::after {
  width: 68px;
  background: var(--orange);
}

      .marquee {
        display: flex;
        gap: 34px;
        padding: 18px 0;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.045);
        color: rgba(255, 250, 245, 0.34);
        font-family: var(--font);
        font-size: clamp(2rem, 4.6vw, 4.9rem);
        font-style: normal;
        font-weight: 300;
        white-space: nowrap;
      }

      .marquee-star {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  color: #FF5F1F;

  font-weight: 500;

  line-height: 1;

  transform: translateY(-1px);

  text-shadow:
    0 0 18px rgba(255, 95, 31, 0.35);
}

      .marquee-track {
        display: flex;
        gap: 34px;
        min-width: max-content;
        animation: marquee 28s linear infinite;
      }

      .work-layout {
        display: grid;
        grid-template-columns: 0.36fr 0.64fr;
        gap: clamp(34px, 5vw, 74px);
        align-items: start;
      }

      .project-list {
        display: grid;
      }

      .project-item {
  display: flex;
  align-items: center;

  gap: 10px;

  min-height: 76px;

  padding: 0;

  border: 0;
  border-bottom: 1px solid rgba(5, 5, 5, 0.12);

  color: rgba(5, 5, 5, 0.38);

  background: transparent;

  cursor: pointer;

  font-family: var(--font);

  transition:
    color 500ms var(--ease),
    transform 500ms var(--ease);
}
.project-item:hover,
.project-item.is-active {
  border-bottom-color: rgba(255, 107, 43, 0.42);
}

.project-number {
  min-width: 34px;
}

      .project-item.is-active,
      .project-item:hover {
        color: #050505;
        transform: translateX(8px);
      }

      .project-number {
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.16em;
      }

      .project-title {
  margin: 0;
  margin-left: 2px;

  font-size: clamp(1.25rem, 2vw, 2rem);
  font-weight: 400;
  line-height: 1;

  letter-spacing: 0.03em;

  text-transform: none;
}

      .project-line {
        display: none;
      }

      .project-stage {
  position: sticky;

  top: 118px;

  min-height: 520px;

  overflow: visible;

  border-radius: 24px;

  background: transparent;
}

.project-visual {
  position: absolute;

  inset: 0;

  opacity: 0;

  transform: translateY(20px) scale(.98);

  filter: blur(12px);

  transition:
    opacity 800ms var(--ease),
    transform 1000ms var(--ease),
    filter 1000ms var(--ease);
}

.behance-frame {
  width: 100%;
  height: 100%;

  min-height: 460px;

  border: 0;
  border-radius: 24px;

  background: #111;

  overflow: hidden;

  box-shadow:
    0 30px 90px rgba(0,0,0,.28);
}

      .project-visual.is-active {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }


      .process {
        background: #050505;
        
      }

      .process-steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        border-top: 0;
      }

      .step {
        position: relative;
        display: flex;
        min-height: 390px;
        flex-direction: column;
        justify-content: space-between;
        gap: 34px;
        overflow: hidden;
        padding: clamp(25px, 4vw, 38px);
        border: 1px solid rgba(255, 250, 245, 0.08);
        border-radius: 8px;
        background: rgba(255, 250, 245, 0.035);
        backdrop-filter: blur(16px);
        transform: translateY(30px);
        opacity: 0;
        transition:
          transform 900ms var(--ease),
          opacity 900ms var(--ease);
      }

      .step.is-visible {
        transform: translateY(0);
        opacity: 1;
      }

      .step span {
        color: var(--orange);
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 400;

    <script>
      const cursor = document.querySelector(".cursor");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      const smoothPointer = { x: pointer.x, y: pointer.y };
      window.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
      function animateCursor() {
        smoothPointer.x += (pointer.x - smoothPointer.x) * 0.16;
        smoothPointer.y += (pointer.y - smoothPointer.y) * 0.16;
        if (cursor) cursor.style.transform = `translate3d(${smoothPointer.x - 9}px, ${smoothPointer.y - 9}px, 0)`;
        requestAnimationFrame(animateCursor);
      }
      if (!reduceMotion) animateCursor();
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) { entry.target.classList.add("is-visible"); observer.unobserve(entry.target); }
        });
      }, { threshold: 0.18 });
      document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
    </script>
